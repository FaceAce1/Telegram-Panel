# .github/workflows/docker-build.yml
name: Build and Publish Docker Image to GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 授予 推送容器到 GHCR 的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'  # PR 事件不推送
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # 自动生成的令牌，无需手动配置

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/telegram-panel
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.description=Telegram 多账户管理面板
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}  # 非 PR 时推送
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 项目使用 SQLite 且数据持久化到 ./docker-data，构建时无需额外配置

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')  # 仅标签推送时触发部署
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 拉取最新镜像（使用 GHCR 地址）
            docker pull ghcr.io/${{ github.repository_owner }}/telegram-panel:${{ github.ref_name }}
            
            # 进入部署目录（根据实际路径调整）
            cd /path/to/telegram-panel-deployment
            
            # 停止旧容器并启动新容器（使用 docker-compose 保持数据持久化）
            docker-compose down
            docker-compose up -d
